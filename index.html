<script>
// ================= 1. Util & Database =================
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const uid = p => p + '_' + Math.random().toString(36).slice(2, 11);
const todayLocal = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Jakarta' });
const nowLocal = () => new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' });
const safeURL = u => { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; };
const normURL = u => { u = String(u || '').trim(); if (!u) return ''; if (/^https?:\/\//i.test(u)) return u; if (/^[a-z]+:/i.test(u)) return ''; return 'https://' + u; };
const badge = (t, c = 'slate') => `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-${c}-100 text-${c}-700">${esc(t)}</span>`;

const defaultDB = { prospects: [], leads: [], accounts: [], pics: [], opportunities: [], proposals: [], activities: [], auditTrail: [] };
let currentUser = null, dbCache = null, unsub = null, shownFor = null, currentTab = 'dashboard', persistTimer = null;

// getDB: selalu melengkapi field yang hilang (data lama tidak bikin crash)
function getDB() {
    if (!dbCache) dbCache = clone(defaultDB);
    Object.keys(defaultDB).forEach(k => { if (!Array.isArray(dbCache[k])) dbCache[k] = []; });
    return dbCache;
}
// Satu penulisan Firestore per aksi (debounce); struktur data tidak berubah: userdata/{uid}
function persist() {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(() => {
        if (!currentUser || !dbCache) return;
        firestoreDB.collection('userdata').doc(currentUser.uid).set(dbCache).catch(e => { console.error(e); alert('Gagal menyimpan ke database: ' + e.message); });
    }, 60);
}
function saveDB(db) { dbCache = db; persist(); }
function auditEntry(action, module, description) {
    return { id: uid('aud'), timestamp: nowLocal(), user: currentUser ? currentUser.email : 'System', action, module, description };
}
function logAudit(action, module, description) {
    const db = getDB();
    db.auditTrail.unshift(auditEntry(action, module, description));
    if (db.auditTrail.length > 500) db.auditTrail.length = 500;
    persist();
}
function resetAllData() {
    if (prompt('Ini MENGHAPUS SEMUA DATA dan tidak bisa dibatalkan.\nKetik HAPUS untuk melanjutkan:') !== 'HAPUS') return;
    saveDB(clone(defaultDB));
    logAudit('RESET', 'System', 'Menghapus seluruh data dan mengembalikan aplikasi ke kondisi kosong.');
    renderModule(currentTab);
}

// ================= 2. Auth =================
function showAuth(mode) {
    $('app-shell').classList.add('hidden'); $('app-shell').classList.remove('flex');
    $('auth-screen').classList.remove('hidden');
    const reg = mode === 'register', ic = 'w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500';
    $('auth-box').innerHTML = `
        <div class="text-center mb-6"><div class="w-14 h-14 mx-auto rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-2xl mb-3">B</div>
        <h1 class="text-white font-bold text-xl">${reg ? 'Daftar Akun BAYU' : 'Masuk ke BAYU'}</h1>
        <p class="text-slate-400 text-xs mt-1">Sales &amp; Digital Intelligence</p></div>
        <form class="space-y-4" onsubmit="authSubmit(event,${reg})">
            <div><label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Email</label><input type="email" id="a-email" required autocomplete="username" class="${ic}"></div>
            <div><label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password${reg ? ' (min. 6 karakter)' : ''}</label><input type="password" id="a-pass" required minlength="${reg ? 6 : 1}" autocomplete="${reg ? 'new-password' : 'current-password'}" class="${ic}"></div>
            <p id="a-err" class="text-rose-400 text-xs hidden"></p>
            <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm transition">${reg ? 'Daftar &amp; Masuk' : 'Masuk'}</button>
        </form>
        <div class="flex justify-between mt-4">
            ${reg ? '' : '<button onclick="forgotPassword()" class="text-xs text-slate-500 hover:text-slate-300">Lupa password?</button>'}
            <button onclick="showAuth('${reg ? 'login' : 'register'}')" class="text-xs text-slate-500 hover:text-slate-300 ${reg ? 'mx-auto' : ''}">${reg ? 'Sudah punya akun? Masuk' : 'Buat akun baru'}</button>
        </div>`;
}
function authErr(err) {
    const m = { 'auth/email-already-in-use': 'Email ini sudah terdaftar. Silakan masuk saja.', 'auth/invalid-email': 'Format email tidak valid.', 'auth/weak-password': 'Password minimal 6 karakter.', 'auth/user-not-found': 'Email belum terdaftar.', 'auth/wrong-password': 'Password salah.', 'auth/invalid-credential': 'Email atau password salah.', 'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.' };
    const el = $('a-err'); el.textContent = m[err.code] || err.message; el.classList.remove('hidden');
}
function authSubmit(e, reg) {
    e.preventDefault();
    const em = $('a-email').value.trim(), pw = $('a-pass').value;
    (reg ? auth.createUserWithEmailAndPassword(em, pw) : auth.signInWithEmailAndPassword(em, pw)).catch(authErr);
}
function forgotPassword() {
    const email = prompt('Masukkan email akun untuk menerima link reset password:');
    if (!email) return;
    auth.sendPasswordResetEmail(email).then(() => alert('Link reset dikirim ke ' + email + '. Cek inbox/spam.')).catch(e => alert(e.message));
}
function logout() {
    if (!currentUser) { auth.signOut(); return; }
    const db = getDB();
    db.auditTrail.unshift(auditEntry('LOGOUT', 'Auth', 'User logout: ' + currentUser.email));
    firestoreDB.collection('userdata').doc(currentUser.uid).set(db).catch(() => {}).finally(() => auth.signOut());
}
function showApp() {
    $('auth-screen').classList.add('hidden');
    $('app-shell').classList.remove('hidden'); $('app-shell').classList.add('flex');
    $('sidebar-user-info').innerHTML = `<i class="fa-solid fa-circle-user mr-1"></i> ${esc(currentUser.email)}`;
    $('avatar').textContent = (currentUser.email || 'BY').slice(0, 2).toUpperCase();
    buildNav(); switchTab('dashboard');
}
auth.onAuthStateChanged(user => {
    if (unsub) { unsub(); unsub = null; }
    if (!user) { currentUser = null; dbCache = null; shownFor = null; showAuth('login'); return; }
    currentUser = user;
    unsub = firestoreDB.collection('userdata').doc(user.uid).onSnapshot(s => {
        if (s.exists) dbCache = s.data();
        else { dbCache = clone(defaultDB); firestoreDB.collection('userdata').doc(user.uid).set(dbCache).catch(console.error); }
        if (shownFor !== user.uid) { shownFor = user.uid; showApp(); }          // hanya sekali per login (fix #1)
        else if (!s.metadata.hasPendingWrites) renderModule(currentTab);          // abaikan snapshot dari tulisan lokal (fix #3)
    }, err => { console.error(err); alert('Gagal terhubung ke database. Cek koneksi & Firebase config.'); });
});

// ================= 3. Navigasi =================
const NAV = [['dashboard','chart-pie','Dashboard'],['prospects','binoculars','Prospects'],['leads','filter','Leads'],['accounts','building','Accounts & PIC'],['opportunities','handshake','Opportunities'],['pipeline','columns','Pipeline'],['proposals','file-contract','Proposals'],['activities','calendar-check','Activities'],['exposure','chart-line','Exposure Intelligence'],['digital','brain','Digital Intelligence'],['ai','wand-magic-sparkles','AI Advisor'],['audit','clock-rotate-left','Audit Trail']];
function buildNav() {
    $('nav').innerHTML = NAV.map(([id, ic, l]) => `<a href="#" onclick="switchTab('${id}');return false" id="nav-${id}" class="nav-item flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-${ic} w-5 mr-3 text-center"></i>${l}</a>`).join('');
}
function switchTab(id) {
    currentTab = id;
    document.querySelectorAll('.nav-item').forEach(el => { el.classList.remove('bg-indigo-600', 'text-white'); el.classList.add('hover:bg-slate-800'); });
    const a = $('nav-' + id); if (a) { a.classList.remove('hover:bg-slate-800'); a.classList.add('bg-indigo-600', 'text-white'); }
    $('current-page-title').innerText = (NAV.find(n => n[0] === id) || [])[2] || 'Dashboard';
    if (window.innerWidth < 768) $('sidebar').classList.add('-translate-x-full');
    renderModule(id);
}
function toggleSidebar() {
    const s = $('sidebar');
    if (window.innerWidth < 768) s.classList.toggle('-translate-x-full'); else s.classList.toggle('md:hidden');
}
function openModal(title, html) { $('modal-title').innerText = title; $('modal-body').innerHTML = html; $('global-modal').classList.remove('hidden'); }
function closeModal() { $('global-modal').classList.add('hidden'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ================= 4. Intelligence Engine =================
function calculateOppMetrics(opp) {
    const n = v => Number(v || 0);
    const won = opp.stage === 'Won' || opp.status === 'Closed Won', lost = opp.stage === 'Lost' || opp.status === 'Closed Lost';
    const prob = won ? 100 : lost ? 0 : n(opp.probability);
    const weightedValue = n(opp.commercialValue) * prob / 100;
    const brand = n(opp.brandExposure);
    const exposureScore = Math.round(Math.min(100, brand * 0.35 + n(opp.audienceReach) * 0.25 + n(opp.relationshipValue) * 0.2 + n(opp.strategicValue) * 0.2));
    const signals = [];
    if (!won && !lost) {
        if (!opp.decisionMaker) signals.push({ type: 'warning', text: 'Decision Maker belum tersedia' });
        if (!opp.picId) signals.push({ type: 'danger', text: 'PIC belum terhubung' });
        if (opp.relationshipStrength === 'Low') signals.push({ type: 'danger', text: 'Relationship Strength rendah' });
        if (opp.competitivePosition === 'Lagging') signals.push({ type: 'warning', text: 'Competitive Position tertinggal' });
        if (!opp.budgetConfirmation) signals.push({ type: 'warning', text: 'Budget belum dikonfirmasi' });
        if (opp.status === 'Stalled') signals.push({ type: 'danger', text: 'Opportunity Stalled / macet' });
    }
    if (exposureScore > 80 || brand > 75) signals.push({ type: 'success', text: 'Exposure tinggi & potensial' });
    const risk = signals.filter(s => s.type !== 'success').length;   // sinyal success tidak dihitung risiko (fix #2)
    let health = 'Healthy', healthColor = 'emerald';
    if (signals.some(s => s.type === 'danger') || risk >= 3) { health = 'Critical'; healthColor = 'rose'; }
    else if (risk >= 1) { health = 'At Risk'; healthColor = 'amber'; }
    let nba = opp.nextAction || 'Lakukan follow-up rutin dengan PIC';
    if (won || lost) nba = 'Opportunity sudah ditutup';
    else if (!opp.decisionMaker) nba = 'Jadwalkan meeting dengan C-Level / Decision Maker';
    else if (!opp.budgetConfirmation) nba = 'Lakukan konfirmasi anggaran/budget tahunan client';
    else if (opp.stage === 'Proposal') nba = 'Kirimkan revisi proposal dan jadwalkan presentasi langsung';
    return { weightedValue, exposureScore, health, healthColor, signals, nba };
}
const hb = m => `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-${m.healthColor}-100 text-${m.healthColor}-800">${m.health}</span>`;

// ================= 5. CRUD generik =================
const ST = ['New Opportunity', 'Contact', 'Meeting', 'Proposal', 'Negotiation', 'Won', 'Lost'];
const accName = (db, id) => (db.accounts.find(a => a.id === id) || { name: 'Unknown Account' }).name;
const oppName = (db, id) => (db.opportunities.find(o => o.id === id) || { name: 'Unknown Opportunity' }).name;
const oppOpts = () => getDB().opportunities.map(o => [o.id, o.name]);
const num = (k, label, def = 0, max) => ({ k, label, t: 'number', def, max });
const M = {
    prospects: { pre: 'p', label: 'Prospect', mod: 'Prospects', title: 'Daftar Prospects',
        f: [{ k: 'name', label: 'Prospect Name', req: 1, wide: 1 }, { k: 'industry', label: 'Industry' }, { k: 'contactPerson', label: 'Contact Person' }, { k: 'email', label: 'Email', t: 'email' }, { k: 'phone', label: 'Phone' }, { k: 'status', label: 'Status', t: 'select', opts: ['New', 'Contacted', 'Qualified', 'Unqualified'], def: 'New' }, { k: 'notes', label: 'Notes', t: 'textarea', wide: 1 }],
        c: [['Prospect Name', r => `<b>${esc(r.name)}</b>`], ['Industry', r => esc(r.industry)], ['Contact Person', r => esc(r.contactPerson)], ['Email / Phone', r => `<span class="text-xs">${esc(r.email)}<br>${esc(r.phone)}</span>`], ['Status', r => badge(r.status)]] },
    leads: { pre: 'l', label: 'Lead', mod: 'Leads', title: 'Daftar Leads',
        f: [{ k: 'name', label: 'Lead Name', req: 1, wide: 1 }, { k: 'source', label: 'Source', t: 'select', opts: ['Inbound Web', 'Referral', 'Cold Outreach', 'Event'], def: 'Inbound Web' }, num('value', 'Estimated Value (Rp)'), { k: 'pic', label: 'PIC' }, { k: 'status', label: 'Status', t: 'select', opts: ['New', 'Qualified', 'Unqualified'], def: 'New' }],
        c: [['Lead Name', r => `<b>${esc(r.name)}</b>`], ['Source', r => esc(r.source)], ['Est. Value', r => rp(r.value)], ['PIC', r => esc(r.pic)], ['Status', r => badge(r.status)]] },
    accounts: { pre: 'acc', label: 'Account', mod: 'Accounts', title: 'Daftar Accounts',
        f: [{ k: 'name', label: 'Account Name', req: 1, wide: 1 }, { k: 'industry', label: 'Industry' }, { k: 'website', label: 'Website', norm: normURL }, { k: 'address', label: 'Address', t: 'textarea', wide: 1 }],
        c: [['Account', r => `<b>${esc(r.name)}</b><br><span class="text-xs text-slate-500">${esc(r.address)}</span>`], ['Industry', r => esc(r.industry)], ['Website', r => { const u = safeURL(r.website); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:underline text-xs">${esc(r.website)}</a>` : esc(r.website); }]],
        onDelete: (db, id) => { db.pics.forEach(p => { if (p.accountId === id) p.accountId = ''; }); db.opportunities.forEach(o => { if (o.accountId === id) o.accountId = ''; }); },
        warn: 'Menghapus Account dapat mempengaruhi relasi PIC & Opportunity. Lanjutkan?' },
    pics: { pre: 'pic', label: 'PIC', mod: 'Accounts & PIC', title: 'Daftar PIC / Contacts',
        f: [{ k: 'accountId', label: 'Account', t: 'select', req: 1, blank: 'Pilih Account', opts: () => getDB().accounts.map(a => [a.id, a.name]), wide: 1 }, { k: 'name', label: 'PIC Name', req: 1 }, { k: 'title', label: 'Title / Jabatan' }, { k: 'email', label: 'Email', t: 'email' }, { k: 'phone', label: 'Phone' }],
        c: [['Account', r => badge(accName(getDB(), r.accountId), 'indigo')], ['PIC', r => `<b>${esc(r.name)}</b><br><span class="text-xs text-slate-500">${esc(r.title)}</span>`], ['Email / Phone', r => `<span class="text-xs">${esc(r.email)}<br>${esc(r.phone)}</span>`]],
        onDelete: (db, id) => { db.opportunities.forEach(o => { if (o.picId === id) o.picId = ''; }); } },
    opportunities: { pre: 'opp', label: 'Opportunity', mod: 'Opportunities', title: 'Daftar Opportunities', warn: 'Menghapus opportunity ini juga akan menghapus proposal & activity yang terhubung. Lanjutkan?',
        f: [{ k: 'accountId', label: 'Account', t: 'select', req: 1, blank: 'Pilih Account', opts: () => getDB().accounts.map(a => [a.id, a.name]), onchange: 'updPic()' },
            { k: 'picId', label: 'PIC', t: 'select', req: 1, blank: 'Pilih PIC', opts: d => getDB().pics.filter(p => p.accountId === d.accountId).map(p => [p.id, `${p.name} (${p.title})`]) },
            { k: 'name', label: 'Opportunity Name', req: 1, wide: 1 },
            { k: 'type', label: 'Type', t: 'select', opts: ['Sales', 'Content Collaboration', 'Digital Campaign', 'Partnership', 'Sponsorship', 'Affiliate', 'Influencer', 'Event', 'Media', 'Strategic Partnership', 'Other'], def: 'Sales' },
            num('commercialValue', 'Commercial Value (Rp)'), num('probability', 'Probability (%)', 50, 100),
            num('audienceReach', 'Audience Reach (0-100)', 50, 100), num('brandExposure', 'Brand Exposure (0-100)', 50, 100), num('relationshipValue', 'Relationship Val (0-100)', 50, 100), num('strategicValue', 'Strategic Val (0-100)', 50, 100),
            { k: 'decisionMaker', label: 'Decision Maker Confirmed', t: 'checkbox' }, { k: 'budgetConfirmation', label: 'Budget Confirmed', t: 'checkbox' }, { k: 'needConfirmation', label: 'Need Confirmed', t: 'checkbox' }, { k: 'timingConfirmation', label: 'Timing Confirmed', t: 'checkbox' },
            { k: 'competitor', label: 'Competitor' }, { k: 'competitivePosition', label: 'Competitive Position', t: 'select', opts: ['Leading', 'Parity', 'Lagging'], def: 'Parity' },
            { k: 'relationshipStrength', label: 'Relationship Strength', t: 'select', opts: ['High', 'Medium', 'Low'], def: 'Medium' },

        const days = o.expectedCloseDate ? dd(o.expectedCloseDate, today) : null;
        const last = db.activities.filter(a => a.oppId === o.id).map(a => a.date).sort().pop(), idle = last ? dd(today, last) : null;
        const urg = days === null ? 0 : days < 0 ? 30 : days <= 14 ? 20 : days <= 30 ? 10 : 0;
        const priority = Math.round(Math.min(100, m.weightedValue / maxW * 40 + urg + (m.health === 'Critical' ? 15 : m.health === 'At Risk' ? 8 : 0) + m.exposureScore * 0.15));
        if (days !== null && days < 0) ins.push({ l: 'danger', t: `"${o.name}" melewati target close date ${-days} hari. Update tanggal atau tutup sebagai Lost.` });
        else if (days !== null && days <= 7) ins.push({ l: 'warning', t: `"${o.name}" ditargetkan close dalam ${days} hari. Pastikan keputusan dan budget final.` });
        if (idle === null) ins.push({ l: 'warning', t: `"${o.name}" belum punya activity. Jadwalkan kontak pertama.` });
        else if (idle > 14) ins.push({ l: 'warning', t: `"${o.name}" tanpa activity ${idle} hari terakhir. Risiko dingin.` });
        if (o.stage === 'Proposal' && !db.proposals.some(p => p.oppId === o.id)) ins.push({ l: 'warning', t: `"${o.name}" di stage Proposal tapi belum ada data proposal.` });
        if ((o.stage === 'Negotiation' || o.stage === 'Proposal') && !o.budgetConfirmation) ins.push({ l: 'danger', t: `"${o.name}" sudah di ${o.stage} tapi budget belum dikonfirmasi.` });
        return { o, m, days, idle, priority, acc: accName(db, o.accountId) };
    }).sort((a, b) => b.priority - a.priority);
    db.proposals.filter(p => p.status === 'Sent' && p.date && dd(today, p.date) > 7).forEach(p => ins.push({ l: 'warning', t: `Proposal "${p.title}" terkirim ${dd(today, p.date)} hari lalu tanpa update. Lakukan follow-up.` }));
    const od = db.activities.filter(a => a.status === 'Scheduled' && a.date < today).length;
    if (od) ins.push({ l: 'danger', t: `${od} activity terjadwal sudah lewat tanggal tapi belum Completed.` });
    if (rows.length > 1 && totalW > 0) { const t = rows.reduce((a, b) => b.m.weightedValue > a.m.weightedValue ? b : a), s = t.m.weightedValue / totalW; if (s > 0.4) ins.push({ l: 'warning', t: `Konsentrasi tinggi: "${t.o.name}" menyumbang ${Math.round(s * 100)}% weighted pipeline.` }); }
    if (won.length + lost.length >= 3) ins.push({ l: 'info', t: `Win rate ${Math.round(won.length / (won.length + lost.length) * 100)}% (${won.length} Won / ${lost.length} Lost).` });
    const strong = rows.filter(r => r.m.exposureScore > 80).length;
    if (strong) ins.push({ l: 'success', t: `${strong} opportunity berexposure tinggi. Pertimbangkan jadi studi kasus atau paket media.` });
    if (!db.opportunities.length) ins.push({ l: 'info', t: 'Belum ada opportunity. Tambahkan data agar analisa berjalan.' });
    else if (!ins.length) ins.push({ l: 'success', t: 'Tidak ada isu kritis. Pertahankan ritme follow-up.' });
    return { rows, ins, totalW, wonValue: won.reduce((s, o) => s + Number(o.commercialValue || 0), 0), openCount: open.length };
}
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
const aiEndpoint = () => lsGet('bayu_ai_endpoint');
const aiShow = t => { const el = $('ai-output'); if (el) el.textContent = t; };
const AI_SYSTEM = 'Kamu adalah penasihat penjualan untuk tim sales di Indonesia (BAYU CRM). Jawab dalam Bahasa Indonesia, ringkas, praktis, dan berbasis data pipeline yang diberikan. Berikan prioritas jelas dan langkah konkret (siapa, apa, kapan). Jangan mengarang data yang tidak ada di konteks; jika data kurang, katakan apa yang perlu dilengkapi. Hari ke-close negatif berarti sudah lewat target.';
function aiSaveSettings() {
    lsSet('bayu_gemini_key', $('ai-gkey').value.trim());
    lsSet('bayu_gemini_model', $('ai-gmodel').value.trim());
    lsSet('bayu_ai_endpoint', $('ai-endpoint').value.trim());
    aiShow('Pengaturan AI tersimpan di browser ini.' + (lsGet('bayu_gemini_key') ? ' Mode: Gemini langsung.' : aiEndpoint() ? ' Mode: endpoint.' : ' Mode: analisa lokal saja.'));
}
function aiContext() {
    const a = aiAnalyze();
    return { tanggal: todayLocal(), opportunity_terbuka: a.openCount, forecast_weighted: Math.round(a.totalW), nilai_won: Math.round(a.wonValue),
        prioritas: a.rows.slice(0, 15).map(r => ({ nama: r.o.name, akun: r.acc, stage: r.o.stage, nilai: r.o.commercialValue, probabilitas: r.o.probability, health: r.m.health, exposure: r.m.exposureScore, hari_ke_close: r.days, hari_tanpa_activity: r.idle, sinyal: r.m.signals.map(s => s.text) })), temuan: a.ins.map(i => i.t) };
}
async function askGemini(question, context, key) {
    const model = lsGet('bayu_gemini_model') || 'gemini-3.5-flash-lite';
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({
            systemInstruction: { parts: [{ text: AI_SYSTEM }] },
            contents: [{ role: 'user', parts: [{ text: `DATA PIPELINE (JSON):\n${JSON.stringify(context)}\n\nPERTANYAAN: ${question}` }] }],
            generationConfig: { maxOutputTokens: 1000 }
        })
    });
    const d = await res.json();
    if (!res.ok) throw new Error((d.error && d.error.message) || 'HTTP ' + res.status);
    return (((d.candidates || [])[0] || {}).content || { parts: [] }).parts.map(p => p.text || '').join('') || 'Tidak ada jawaban dari model.';
}
async function aiAsk(question) {
    const gk = lsGet('bayu_gemini_key'), ep = aiEndpoint();
    if (!gk && !ep) { aiShow('AI belum diatur. Analisa lokal di atas tetap aktif. Buka "Pengaturan AI" di bawah, isi API key Gemini, lalu Simpan.'); return; }
    aiShow('Menganalisa...');
    try {
        const context = aiContext();
        if (gk) { aiShow(await askGemini(question, context, gk)); return; }
        const res = await fetch(ep, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + await currentUser.getIdToken() }, body: JSON.stringify({ question, context }) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json(); aiShow(d.text || JSON.stringify(d));
    } catch (err) { aiShow('Gagal menghubungi AI: ' + err.message); }
}
const aiAskBox = () => aiAsk($('ai-question').value.trim() || 'Berikan ringkasan kondisi pipeline dan 5 aksi prioritas minggu ini.');
const aiExplain = id => { const o = getDB().opportunities.find(x => x.id === id); if (o) aiAsk(`Analisa opportunity "${o.name}": risiko utama, peluang menang, dan langkah konkret 7 hari ke depan.`); };
function renderAI(c) {
    const a = aiAnalyze(), order = { danger: 0, warning: 1, info: 2, success: 3 };
    const sty = { danger: ['bg-rose-50 border-rose-200 text-rose-800', 'triangle-exclamation'], warning: ['bg-amber-50 border-amber-200 text-amber-800', 'circle-exclamation'], info: ['bg-blue-50 border-blue-200 text-blue-800', 'circle-info'], success: ['bg-emerald-50 border-emerald-200 text-emerald-800', 'circle-check'] };
    c.innerHTML = `<div class="space-y-6">
        <div class="bg-gradient-to-r from-indigo-900 to-violet-700 rounded-2xl p-6 text-white shadow-lg"><h3 class="text-xl font-bold"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>AI Advisor</h3><p class="text-indigo-200 text-sm mt-1">Analisa pipeline, prioritas deal, dan rekomendasi aksi. Mesin lokal selalu aktif; AI penuh aktif bila endpoint diatur.</p></div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${kpi('Opportunity Terbuka', a.openCount, 'Belum Won/Lost', 'folder-open', 'indigo')}${kpi('Forecast (Weighted)', rp(a.totalW), 'Perkiraan realistis', 'chart-line', 'emerald')}${kpi('Sudah Won', rp(a.wonValue), 'Closed Won', 'trophy', 'amber')}</div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6"><h4 class="font-bold text-slate-800 mb-3">Temuan &amp; Peringatan</h4><div class="space-y-2">${[...a.ins].sort((x, y) => order[x.l] - order[y.l]).map(i => `<div class="border rounded-lg px-3 py-2 text-sm flex items-start ${sty[i.l][0]}"><i class="fa-solid fa-${sty[i.l][1]} mt-0.5 mr-2"></i><span>${esc(i.t)}</span></div>`).join('')}</div></div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto"><h4 class="font-bold text-slate-800 p-6 pb-3">Prioritas Deal &amp; Rekomendasi</h4><table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-slate-600 uppercase text-xs border-y"><tr><th class="p-3">#</th><th class="p-3">Opportunity</th><th class="p-3">Priority</th><th class="p-3">Health</th><th class="p-3">Rekomendasi</th><th class="p-3"></th></tr></thead>
            <tbody class="divide-y divide-slate-100">${a.rows.length ? a.rows.map((r, i) => `<tr><td class="p-3 text-slate-400">${i + 1}</td><td class="p-3 font-semibold">${esc(r.o.name)}<br><span class="text-xs font-normal text-slate-500">${esc(r.acc)} · ${rp(r.o.commercialValue)}</span></td><td class="p-3"><b class="text-indigo-600">${r.priority}</b><span class="text-xs text-slate-400"> / 100</span></td><td class="p-3">${hb(r.m)}</td><td class="p-3 text-xs max-w-sm">${esc(r.m.nba)}</td><td class="p-3"><button onclick="aiExplain('${r.o.id}')" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">Tanya AI</button></td></tr>`).join('') : '<tr><td colspan="6" class="p-6 text-center text-slate-500">Belum ada opportunity terbuka.</td></tr>'}</tbody></table></div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-3"><h4 class="font-bold text-slate-800">Tanya AI</h4>
            <textarea id="ai-question" rows="2" placeholder="Contoh: Deal mana yang paling berpotensi closing bulan ini dan apa yang harus saya lakukan?" class="${IC}"></textarea>
            <button onclick="aiAskBox()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm">Analisa</button>
            <pre id="ai-output" class="whitespace-pre-wrap text-sm text-slate-800 bg-slate-50 border border-slate-200 rounded-lg p-3 min-h-[60px] font-sans">Jawaban AI akan tampil di sini.</pre>
            <details open class="text-xs text-slate-600"><summary class="cursor-pointer font-semibold">Pengaturan AI</summary>
                <p class="mt-2">Isi <b>API key Gemini</b> dari aistudio.google.com/apikey. Key hanya disimpan di browser ini (tidak masuk ke GitHub atau Firebase) dan dikirim langsung ke Google. Ringkasan pipeline (nama deal, akun, nilai) ikut terkirim. Jangan isi di komputer bersama. Opsional: endpoint proxy sendiri, dipakai kalau key Gemini kosong.</p>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mt-2">
                    <input id="ai-gkey" type="password" autocomplete="off" value="${esc(lsGet('bayu_gemini_key'))}" placeholder="API key Gemini (AIza...)" class="px-3 py-2 border border-slate-300 rounded-lg text-sm md:col-span-2">
                    <input id="ai-gmodel" value="${esc(lsGet('bayu_gemini_model'))}" placeholder="Model (default gemini-3.5-flash-lite)" class="px-3 py-2 border border-slate-300 rounded-lg text-sm">
                    <input id="ai-endpoint" value="${esc(aiEndpoint())}" placeholder="Endpoint proxy (opsional)" class="px-3 py-2 border border-slate-300 rounded-lg text-sm md:col-span-2">
                    <button onclick="aiSaveSettings()" class="px-3 py-2 border border-slate-300 rounded-lg font-semibold hover:bg-slate-50">Simpan</button>
                </div></details></div>
    </div>`;
}
</script>
