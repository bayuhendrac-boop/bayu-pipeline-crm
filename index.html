    <script>
        // --- 1. Storage & Database Setup (Firestore, per-user) ---
        // Database kosong - tidak ada data demo/dummy. Semua modul dimulai dari nol.
        const defaultDB = {
            prospects: [],
            leads: [],
            accounts: [],
            pics: [],
            opportunities: [],
            proposals: [],
            activities: [],
            auditTrail: []
        };

        let currentUser = null;      // objek user Firebase Auth yang sedang login
        let dbCache = null;          // cache lokal data Firestore (agar getDB() tetap sinkron)
        let firestoreUnsub = null;   // fungsi untuk berhenti listen snapshot saat logout
        let suppressNextSnapshotRender = false;

        // getDB() tetap sinkron seperti sebelumnya - membaca dari cache lokal
        // yang selalu di-update real-time oleh listener Firestore.
        function getDB() {
            return dbCache || JSON.parse(JSON.stringify(defaultDB));
        }

        // saveDB() update cache lokal langsung (UI instan), lalu kirim ke Firestore di background.
        function saveDB(db) {
            dbCache = db;
            if (!currentUser) return;
            suppressNextSnapshotRender = true;
            firestoreDB.collection('userdata').doc(currentUser.uid).set(db)
                .catch(err => console.error('Gagal menyimpan ke Firestore:', err));
        }

        function resetAllData() {
            if (confirm('Apakah Anda yakin ingin MENGHAPUS SEMUA DATA (prospects, leads, accounts, opportunities, dll) dan mengembalikan aplikasi ke kondisi kosong? Tindakan ini tidak bisa dibatalkan.')) {
                saveDB(JSON.parse(JSON.stringify(defaultDB)));
                logAudit('RESET', 'System', 'Menghapus seluruh data dan mengembalikan aplikasi ke kondisi kosong.');
                switchTab(currentTab);
                alert('Semua data berhasil dihapus.');
            }
        }

        function logAudit(action, module, description) {
            const db = getDB();
            const now = new Date();
            const timestamp = now.toISOString().replace('T', ' ').substring(0, 19);
            const auditEntry = {
                id: 'aud_' + Math.random().toString(36).substr(2, 9),
                timestamp,
                user: currentUser ? currentUser.email : 'System',
                action,
                module,
                description
            };
            db.auditTrail.unshift(auditEntry);
            saveDB(db);
        }

        // --- 1b. Auth System (Firebase Authentication - Email/Password) ---
        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            const shell = document.getElementById('app-shell');
            shell.classList.remove('hidden');
            shell.classList.add('flex');
            const userInfo = document.getElementById('sidebar-user-info');
            if (userInfo && currentUser) userInfo.innerHTML = `<i class="fa-solid fa-circle-user mr-1"></i> ${escapeHTML(currentUser.email)}`;
            switchTab('dashboard');
        }

        function showAuthScreen(mode) {
            const shell = document.getElementById('app-shell');
            shell.classList.add('hidden');
            shell.classList.remove('flex');
            document.getElementById('auth-screen').classList.remove('hidden');
            if (mode === 'register') renderRegisterForm();
            else renderLoginForm();
        }

        function renderRegisterForm() {
            document.getElementById('auth-box').innerHTML = `
                <div class="text-center mb-6">
                    <div class="w-14 h-14 mx-auto rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-2xl shadow-md mb-3">B</div>
                    <h1 class="text-white font-bold text-xl">Daftar Akun BAYU</h1>
                    <p class="text-slate-400 text-xs mt-2">Akun tersimpan online lewat Firebase, jadi bisa login dari perangkat mana pun.</p>
                </div>
                <form id="register-form" class="space-y-4" onsubmit="handleRegisterSubmit(event)">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Email</label>
                        <input type="email" id="register-email" required autocomplete="username" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password (min. 6 karakter)</label>
                        <input type="password" id="register-password" required minlength="6" autocomplete="new-password" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <p id="register-error" class="text-rose-400 text-xs hidden"></p>
                    <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm transition">Daftar &amp; Masuk</button>
                </form>
                <button onclick="showAuthScreen('login')" class="w-full mt-4 text-xs text-slate-500 hover:text-slate-300 transition">Sudah punya akun? Masuk di sini</button>
            `;
        }

        function renderLoginForm() {
            document.getElementById('auth-box').innerHTML = `
                <div class="text-center mb-6">
                    <div class="w-14 h-14 mx-auto rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-2xl shadow-md mb-3">B</div>
                    <h1 class="text-white font-bold text-xl">Masuk ke BAYU</h1>
                    <p class="text-slate-400 text-xs mt-1">Sales &amp; Digital Intelligence</p>
                </div>
                <form id="login-form" class="space-y-4" onsubmit="handleLoginSubmit(event)">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Email</label>
                        <input type="email" id="login-email" required autocomplete="username" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password</label>
                        <input type="password" id="login-password" required autocomplete="current-password" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <p id="login-error" class="text-rose-400 text-xs hidden"></p>
                    <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm transition">Masuk</button>
                </form>
                <div class="flex justify-between mt-4">
                    <button onclick="handleForgotPassword()" class="text-xs text-slate-500 hover:text-slate-300 transition">Lupa password?</button>
                    <button onclick="showAuthScreen('register')" class="text-xs text-slate-500 hover:text-slate-300 transition">Buat akun baru</button>
                </div>
            `;
        }

        function friendlyAuthError(err) {
            const map = {
                'auth/email-already-in-use': 'Email ini sudah terdaftar. Silakan masuk (login) saja.',
                'auth/invalid-email': 'Format email tidak valid.',
                'auth/weak-password': 'Password terlalu lemah, minimal 6 karakter.',
                'auth/user-not-found': 'Email belum terdaftar.',
                'auth/wrong-password': 'Password salah.',
                'auth/invalid-credential': 'Email atau password salah.',
                'auth/too-many-requests': 'Terlalu banyak percobaan gagal. Coba lagi beberapa saat lagi.'
            };
            return map[err.code] || err.message;
        }

        function handleRegisterSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const errEl = document.getElementById('register-error');
            errEl.classList.add('hidden');
            auth.createUserWithEmailAndPassword(email, password)
                .catch(err => {
                    errEl.textContent = friendlyAuthError(err);
                    errEl.classList.remove('hidden');
                });
            // onAuthStateChanged akan otomatis menangani perpindahan ke dashboard.
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');
            auth.signInWithEmailAndPassword(email, password)
                .catch(err => {
                    errEl.textContent = friendlyAuthError(err);
                    errEl.classList.remove('hidden');
                });
        }

        function handleForgotPassword() {
            const email = prompt('Masukkan email akun kamu untuk menerima link reset password:');
            if (!email) return;
            auth.sendPasswordResetEmail(email)
                .then(() => alert('Link reset password sudah dikirim ke ' + email + '. Cek inbox/spam folder.'))
                .catch(err => alert(friendlyAuthError(err)));
        }

        function logout() {
            if (currentUser) logAudit('LOGOUT', 'Auth', `User logout: ${currentUser.email}`);
            auth.signOut();
        }

        // Listener utama: memantau status login Firebase Authentication.
        // Ini menggantikan pengecekan localStorage/sessionStorage manual.
        auth.onAuthStateChanged(user => {
            if (firestoreUnsub) { firestoreUnsub(); firestoreUnsub = null; }
            if (user) {
                currentUser = user;
                // Dengarkan data Firestore user ini secara real-time.
                // onSnapshot otomatis membuat dokumen kosong kalau belum ada (user baru).
                firestoreUnsub = firestoreDB.collection('userdata').doc(user.uid)
                    .onSnapshot(docSnap => {
                        if (docSnap.exists) {
                            dbCache = docSnap.data();
                        } else {
                            dbCache = JSON.parse(JSON.stringify(defaultDB));
                            firestoreDB.collection('userdata').doc(user.uid).set(dbCache).catch(console.error);
                        }
                        showApp();
                        if (!suppressNextSnapshotRender) {
                            renderModule(currentTab);
                        }
                        suppressNextSnapshotRender = false;
                    }, err => {
                        console.error('Firestore listener error:', err);
                        alert('Gagal terhubung ke database. Cek koneksi internet & Firebase config kamu.');
                    });
            } else {
                currentUser = null;
                dbCache = null;
                showAuthScreen('login');
            }
        });

        // --- 2. Security & Sanitization ---
        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function normalizeWebsiteURL(url) {
            const trimmed = String(url || '').trim();
            if (!trimmed) return '';
            if (/^https?:\/\//i.test(trimmed)) return trimmed;
            if (trimmed.toLowerCase().startsWith('javascript:')) return '';
            return 'https://' + trimmed;
        }

        function sanitizeURL(url) {
            if (!url) return '#';
            const trimmed = String(url).trim();
            if (trimmed.toLowerCase().startsWith('javascript:')) {
                return '#';
            }
            return escapeHTML(trimmed);
        }

        function formatRupiah(number) {
            return 'Rp ' + Number(number || 0).toLocaleString('id-ID');
        }

        // --- 3. Navigation / SPA Routing ---
        let currentTab = 'dashboard';

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-indigo-600', 'text-white');
                el.classList.add('hover:bg-slate-800', 'hover:text-white');
            });
            const activeNav = document.getElementById('nav-' + tabId);
            if (activeNav) {
                activeNav.classList.remove('hover:bg-slate-800', 'hover:text-white');
                activeNav.classList.add('bg-indigo-600', 'text-white');
            }

            const titleMap = {
                'dashboard': 'Dashboard',
                'prospects': 'Prospects Management',
                'leads': 'Leads Management',
                'accounts': 'Accounts & PIC / Contacts',
                'opportunities': 'Opportunities & Intelligence Matrix',
                'pipeline': 'Sales Pipeline (Kanban)',
                'proposals': 'Proposals Management',
                'activities': 'Activities & Tasks',
                'exposure-intelligence': 'Exposure Intelligence',
                'digital-intelligence': 'Digital Intelligence',
                'audit-trail': 'Audit Trail'
            };
            document.getElementById('current-page-title').innerText = titleMap[tabId] || 'Dashboard';
            renderModule(tabId);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }

        // --- 4. Intelligence Engines ---
        function calculateOppMetrics(opp) {
            const commercialValue = Number(opp.commercialValue || 0);
            const probability = Number(opp.probability || 0);
            const weightedValue = commercialValue * (probability / 100);

            const brandExposure = Number(opp.brandExposure || 0);
            const audienceReach = Number(opp.audienceReach || 0);
            const relationshipValue = Number(opp.relationshipValue || 0);

            let exposureScore = (brandExposure * 0.4) + (audienceReach > 0 ? 30 : 0) + (relationshipValue * 0.3);
            if (exposureScore > 100) exposureScore = 100;

            let signals = [];
            let hasDanger = false;
            let signalCount = 0;

            if (!opp.decisionMaker) {
                signals.push({ type: 'warning', text: 'Decision Maker belum tersedia' });
            }
            if (!opp.picId) {
                signals.push({ type: 'danger', text: 'PIC belum terhubung' });
                hasDanger = true;
            }
            if (opp.relationshipStrength === 'Low') {
                signals.push({ type: 'danger', text: 'Relationship Strength rendah' });
                hasDanger = true;
            }
            if (opp.competitivePosition === 'Lagging') {
                signals.push({ type: 'warning', text: 'Competitive Position tertinggal' });
            }
            if (!opp.budgetConfirmation) {
                signals.push({ type: 'warning', text: 'Budget belum dikonfirmasi' });
            }
            if (opp.status === 'Stalled') {
                signals.push({ type: 'danger', text: 'Opportunity Stalled / macet' });
                hasDanger = true;
            }

            if (exposureScore > 80 || brandExposure > 75) {
                signals.push({ type: 'success', text: 'Exposure tinggi & potensial' });
                signalCount++;
            }

            signalCount += signals.filter(s => s.type === 'warning' || s.type === 'danger').length;

            let health = 'Healthy';
            let healthColor = 'emerald';
            if (hasDanger || signalCount >= 3) {
                health = 'Critical';
                healthColor = 'rose';
            } else if (signalCount >= 1) {
                health = 'At Risk';
                healthColor = 'amber';
            }

            // Next Best Action determination
            let nba = opp.nextAction || 'Lakukan follow-up rutin dengan PIC';
            if (!opp.decisionMaker) {
                nba = 'Jadwalkan meeting dengan C-Level / Decision Maker';
            } else if (!opp.budgetConfirmation) {
                nba = 'Lakukan konfirmasi anggaran/budget tahunan client';
            } else if (opp.stage === 'Proposal') {
                nba = 'Kirimkan revisi proposal dan jadwalkan presentasi langsung';
            }

            return { weightedValue, exposureScore, health, healthColor, signals, nba };
        }

        function saveOpportunity(e, id) {
            e.preventDefault();
            const db = getDB();
            const accountId = document.getElementById('opp-account').value;
            const picId = document.getElementById('opp-pic').value;
            const name = document.getElementById('opp-name').value;
            const type = document.getElementById('opp-type').value;
            const commercialValue = Number(document.getElementById('opp-value').value || 0);
            const probability = Number(document.getElementById('opp-prob').value || 0);
            const audienceReach = Number(document.getElementById('opp-reach').value || 0);
            const brandExposure = Number(document.getElementById('opp-brand').value || 0);
            const relationshipValue = Number(document.getElementById('opp-relval').value || 0);
            const strategicValue = Number(document.getElementById('opp-stratval').value || 0);
            const decisionMaker = document.getElementById('opp-dm').checked;
            const budgetConfirmation = document.getElementById('opp-budget').checked;
            const needConfirmation = document.getElementById('opp-need').checked;
            const timingConfirmation = document.getElementById('opp-timing').checked;
            const competitor = document.getElementById('opp-competitor').value;
            const competitivePosition = document.getElementById('opp-comppos').value;
            const relationshipStrength = document.getElementById('opp-relstr').value;
            const expectedCloseDate = document.getElementById('opp-date').value;
            const stage = document.getElementById('opp-stage').value;
            const status = document.getElementById('opp-status').value;
            const nextAction = document.getElementById('opp-nextaction').value;

            if (!accountId || !picId) {
                alert('Opportunity wajib memiliki Account dan PIC.');
                return;
            }

            const oppData = {
                id: id || ('opp_' + Math.random().toString(36).substr(2, 9)),
                accountId, picId, name, type, commercialValue, probability,
                audienceReach, brandExposure, relationshipValue, strategicValue,
                decisionMaker, budgetConfirmation, needConfirmation, timingConfirmation,
                competitor, competitivePosition, relationshipStrength, expectedCloseDate,
                stage, status, nextAction
            };

            if (id) {
                const idx = db.opportunities.findIndex(item => item.id === id);
                if (idx !== -1) {
                    db.opportunities[idx] = oppData;
                    logAudit('UPDATE', 'Opportunities', `Memperbarui opportunity: ${name}`);
                }
            } else {
                db.opportunities.push(oppData);
                logAudit('CREATE', 'Opportunities', `Menambahkan opportunity baru: ${name}`);
            }

            saveDB(db);
            closeModal();
            renderOpportunities(document.getElementById('main-content'));
        }

        function deleteOpportunity(id) {
            if (confirm('Menghapus opportunity ini juga akan menghapus proposal & activity yang terhubung. Lanjutkan?')) {
                const db = getDB();
                const idx = db.opportunities.findIndex(item => item.id === id);
                if (idx !== -1) {
                    const name = db.opportunities[idx].name;
                    db.opportunities.splice(idx, 1);
                    // Integritas data: ikut bersihkan proposal & activity yang terhubung
                    const removedProposals = db.proposals.filter(p => p.oppId === id).length;
                    const removedActivities = db.activities.filter(a => a.oppId === id).length;
                    db.proposals = db.proposals.filter(p => p.oppId !== id);
                    db.activities = db.activities.filter(a => a.oppId !== id);
                    saveDB(db);
                    logAudit('DELETE', 'Opportunities', `Menghapus opportunity: ${name}` + (removedProposals || removedActivities ? ` (ikut menghapus ${removedProposals} proposal & ${removedActivities} activity terkait)` : ''));
                    renderOpportunities(document.getElementById('main-content'));
                }
            }
        }

        // Handler drag-and-drop kanban: memindahkan opportunity ke stage baru
        function handleKanbanDrop(e, newStage) {
            e.preventDefault();
            e.currentTarget.classList.remove('ring-2', 'ring-indigo-400');
            const oppId = e.dataTransfer.getData('text/plain');
            if (!oppId) return;
            const db = getDB();
            const idx = db.opportunities.findIndex(o => o.id === oppId);
            if (idx === -1) return;
            const opp = db.opportunities[idx];
            if (opp.stage === newStage) return;
            const oldStage = opp.stage;
            opp.stage = newStage;
            // Otomatis set status closed saat masuk stage Won/Lost
            if (newStage === 'Won') opp.status = 'Closed Won';
            else if (newStage === 'Lost') opp.status = 'Closed Lost';
            else if (opp.status === 'Closed Won' || opp.status === 'Closed Lost') opp.status = 'Active';
            saveDB(db);
            logAudit('UPDATE', 'Pipeline', `Memindahkan opportunity "${opp.name}" dari stage ${oldStage} ke ${newStage}`);
            renderPipeline(document.getElementById('main-content'));
        }

                            <select id="act-status" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                                ${['Scheduled', 'Completed', 'Cancelled'].map(s => `<option value="${s}" ${act.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Notes</label>
                        <textarea id="act-notes" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">${escapeHTML(act.notes)}</textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-700 font-semibold rounded-lg text-sm hover:bg-slate-50 transition">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm transition">Simpan</button>
                    </div>
                </form>
            `;
            openModal(id ? 'Edit Activity' : 'Tambah Activity', html);
        }

        function saveActivity(e, id) {
            e.preventDefault();
            const db = getDB();
            const oppId = document.getElementById('act-opp').value;
            const subject = document.getElementById('act-subject').value;
            const type = document.getElementById('act-type').value;
            const date = document.getElementById('act-date').value;
            const status = document.getElementById('act-status').value;
            const notes = document.getElementById('act-notes').value;

            if (!oppId) {
                alert('Activity wajib terhubung dengan Opportunity.');
                return;
            }

            if (id) {
                const idx = db.activities.findIndex(item => item.id === id);
                if (idx !== -1) {
                    db.activities[idx] = { id, oppId, subject, type, date, status, notes };
                    logAudit('UPDATE', 'Activities', `Memperbarui activity: ${subject}`);
                }
            } else {
                const newId = 'act_' + Math.random().toString(36).substr(2, 9);
                db.activities.push({ id: newId, oppId, subject, type, date, status, notes });
                logAudit('CREATE', 'Activities', `Menambahkan activity baru: ${subject}`);
            }

            saveDB(db);
            closeModal();
            renderActivities(document.getElementById('main-content'));
        }

        function deleteActivity(id) {
            if (confirm('Apakah Anda yakin ingin menghapus activity ini?')) {
                const db = getDB();
                const idx = db.activities.findIndex(item => item.id === id);
                if (idx !== -1) {
                    const subject = db.activities[idx].subject;
                    db.activities.splice(idx, 1);
                    saveDB(db);
                    logAudit('DELETE', 'Activities', `Menghapus activity: ${subject}`);
                    renderActivities(document.getElementById('main-content'));
                }
            }
        }
